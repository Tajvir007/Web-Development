<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table</title>
    <style>
        table{
            border-collapse: collapse;
        }
        td{
            border: 2px solid black;
            padding: 5px;
        }
        th{
            border: 2px solid black;
            padding: 5px;
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <header>

    </header>
    <main>
        <section>
            <h2>Table Info</h2>

            <ol>
                <li>Table tag: table</li>
                <li>Table Head: thead</li>
                <li>Table Body: tbody</li>
                <ul>
                    <li>Table Row: tr</li>
                    <li>Table Data: td</li>
                </ul>
                <li>Table Footer: tfoot</li>
            </ol>
        </section>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Religion</th>
                    <th>Country</th>
                    <th>Age</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Tajvir</td>
                    <td>Islam</td>
                    <td>Bangladesh</td>
                    <td>27</td>
                </tr>
                <tr>
                    <td>Tajvir</td>
                    <td>Islam</td>
                    <td>Bangladesh</td>
                    <td>27</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="4">This is the footer</td>
                </tr>
            </tfoot>
        </table>


    </main>
</body>
</html>
