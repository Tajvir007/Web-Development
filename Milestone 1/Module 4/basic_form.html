<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Form</title>
</head>
<body>
    <header>

    </header>
    <main>
        <section>
            <h2>Pitha Ghor</h2>
            <form>
                <label for="name">Your name:</label>
                <input type="text" id="name" name="name">
                
                <label for="email">Your email:</label>
                <input type="email" name="email" id="email">

                <fieldset>
                    <legend>Select Pitha</legend>

                    <input type="radio" name="pitha" id="chitoy">
                    <label for="chitoy">Chitoy</label>

                    <input type="radio" name="pitha" id="vapa">
                    <label for="vapa">Vapa</label>

                    <input type="radio" name="pitha" id="puri">
                    <label for="puri">Puri</label>
                </fieldset>

                <fieldset>
                    <legend>Select Bhorta</legend>

                    <input type="checkbox" name="" id="dhone">
                    <label for="dhone">Dhone Pata</label>

                    <input type="checkbox" name="" id="begun">
                    <label for="begun">Begun Bharta</label>

                    <input type="checkbox" name="" id="alu">
                    <label for="alu">Alu Bharta</label>
                </fieldset>

                <input type="button" value="Submit">
                <input type="reset" value="Reset">

            </form>
        </section>
    </main>
</body>
</html>
