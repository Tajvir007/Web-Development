<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box Center</title>
    <style>
        .container{
            background-color: rgb(78, 153, 224);
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box{
            background-color: rgb(181, 135, 44);
            height: 200px;
            width: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Flex Box Center</h1>
    <div class="container">
        <div class="box">
            <h4>Centered Box</h4>
        </div>
    </div>
</body>
</html>
