<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <style>
        .container{
            display: flex;
            margin-bottom: 10px;
        }
        .container div{
            border: 2px solid rgb(78, 153, 224);
            height: 100px;
            width: 100px;
            font-size: 30px;
        }

        .box-container{
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: space-around;
            
        }
        .box{
            font-size: 20px;
            border: 2px solid rgb(181, 135, 44);
            height: 50px;
            width: 50px;
        }

        .card-container{
            display: flex;
            flex-wrap: wrap;
            /* gap: 10px; */
            justify-content: space-around;
        }

        .card{
            font-size: 20px;
            border: 2px solid rgb(181, 135, 44);
            height: 50px;
            width: 200px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
    </div>

    <div class="box-container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
    </div>

    <div class="card-container">
        <div class="card">card-1</div>
        <div class="card">card-2</div>
        <div class="card">card-3</div>
        <div class="card">card-4</div>
        <div class="card">card-5</div>
        <div class="card">card-6</div>
        <div class="card">card-7</div>
        <div class="card">card-8</div>
        <div class="card">card-9</div>
        <div class="card">card-10</div>
        <div class="card">card-11</div>
        <div class="card">card-12</div>
        <div class="card">card-13</div>
        <div class="card">card-14</div>
        <div class="card">card-15</div>
        <div class="card">card-16</div>
        <div class="card">card-17</div>
        <div class="card">card-18</div>
        <div class="card">card-19</div>
        <div class="card">card-20</div>
        <div class="card">card-7</div>
        <div class="card">card-8</div>
        <div class="card">card-9</div>
        <div class="card">card-10</div>
        <div class="card">card-11</div>
        <div class="card">card-12</div>

        <div class="card">card-15</div>

        <div class="card">card-17</div>
        <div class="card">card-18</div>
        <div class="card">card-19</div>
        <div class="card">card-20</div>
    </div>

</body>
</html>
