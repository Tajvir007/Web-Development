<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image</title>
</head>
<body>
    <h1>Image</h1>

    <img src="https://mamp.one/wp-content/uploads/2024/09/image-resources2.jpg" height="300px" width="500px" alt="Scenic View">

    <p>This is an image of a scenic view.</p>
    <p>
        <img> → Displays an image. <br>
        src → Specifies the image URL/location. <br>
        height="300px" → Image height is 300 pixels. <br>
        width="500px" → Image width is 500 pixels. <br>
        alt="Scenic View" → Alternative text shown if the image cannot load and helps accessibility.
    </p>

</body>
</html>
